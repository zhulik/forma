version: "3"

tasks:
  default:
    desc: Run static analysis
    cmds:
      - task: lint

  generate:
    desc: Run go generate
    cmds:
      - go generate ./...

  fix:
    desc: Run go fix modernizers
    cmds:
      - go fix ./...

  _check-tree:
    internal: true
    vars:
      RUN: '{{.RUN}}'
      HINT: '{{.HINT}}'
    cmds:
      - |
        set -euo pipefail
        before="$(mktemp)"
        after="$(mktemp)"
        trap 'rm -f "$before" "$after"' EXIT
        {
          git diff
          echo '---UNTRACKED---'
          git ls-files --others --exclude-standard | sort
        } >"$before"
        {{.RUN}}
        {
          git diff
          echo '---UNTRACKED---'
          git ls-files --others --exclude-standard | sort
        } >"$after"
        if ! cmp -s "$before" "$after"; then
          echo "{{.HINT}}"
          git status
          git diff
          exit 1
        fi

  check-generate:
    desc: Run generate and fail if the working tree changes
    cmds:
      - task: _check-tree
        vars:
          RUN: task generate
          HINT: "Code generation produced changes. Run 'task generate' and commit the result."

  check-fix:
    desc: Run go fix and fail if the working tree changes
    cmds:
      - task: _check-tree
        vars:
          RUN: go fix ./...
          HINT: "go fix produced changes. Run 'task fix' and commit the result."

  test:
    desc: Run tests with race detector (when tests exist)
    cmds:
      - go test -race ./...
      - task: test-cli

  test-cli:
    desc: Run forma CLI module tests
    dir: cmd/forma
    cmds:
      - go test -race ./...

  check-init-scaffold:
    desc: Build forma CLI, run init, assert scaffold compiles (Go + web host)
    cmds:
      - |
        set -euo pipefail
        root="$(git rev-parse --show-toplevel)"
        bin="$(mktemp)"
        target="$(mktemp -d "$root/.tmp-scaffold.XXXXXX")"
        trap 'rm -f "$bin"; rm -rf "$target"' EXIT
        ( cd "$root/cmd/forma" && go build -o "$bin" . )
        FORMA_REPLACE="$root" "$bin" init github.com/zhulik/forma/ci-smoke -d "$target"
        test -f "$target/generator.go"
        test -n "$(find "$target/internal/ui" -name '*.gen.go' | head -n 1)"
        test -d "$target/web/src/host"
        test -f "$target/web/src/registry.gen.ts"
        ( cd "$target" && go build -o /dev/null . )
        ( cd "$target/web" && npm test && npm run build )

  lint:
    desc: Run golangci-lint
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run --timeout=5m {{.CLI_ARGS}}
      - task: lint-cli

  lint-cli:
    desc: Run golangci-lint on cmd/forma
    dir: cmd/forma
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run --timeout=5m ./...

  lint-fix:
    desc: Run golangci-lint with autofix
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run --fix --timeout=5m {{.CLI_ARGS}}
