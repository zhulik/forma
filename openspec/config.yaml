schema: spec-driven

# Injected into AI context when creating/updating OpenSpec artifacts.
# Constraints for planning — do not paste verbatim into proposal/design/specs.
context: |
  Product: forma — a Go-native UI framework for building web (and later desktop) apps
  without writing HTML/CSS/JS. Developers compose semantic widgets in Go; a thin React
  host renders a tree built at runtime with [0build](https://0build.dev) semantic CSS
  (`.z-*`; utilities / Class as escape hatch). Widget APIs are hand-written Go in
  framework ui/ with matching host builtins—not kit codegen as SoT. Optimized for human
  and agent authors: dense DSL, strong types, minimal review surface.

  Canonical documents (read before proposing or implementing):
  - doc/user/ — author guide (first-class; update when author UX changes)
  - doc/DESIGN.md — architecture, stack choices, user model, non-goals
  - doc/ROADMAP.md — phased delivery; OpenSpec changes must align unless a proposal
    explicitly revises the roadmap

  Current tip: owned widgets + 0build (ROADMAP P5). Canonical interactive demo:
  examples/todo (forma sync + forma dev). Root main.go is a Hello-style smoke only.
  Package ui/ holds hand-written owned widget types. Breaking changes allowed until a
  stable DSL v1 is declared.

  Delivery order (hard constraint for tasks and proposals):
  1. DSL — specify and refine the Go authoring model (dense, extensible, expressive);
     examples/todo is the north-star interactive demo
  2. User documentation — install, dev workflow, owned widgets, 0build look, custom
     host islands; written against the stabilized DSL
  3. Implementation — React host, Go↔host bridge, Mount/Refresh; driven by DSL
     specs + user guide expectations
  4. Owned-widget breadth / examples — expand surface after todo-sized path is proven;
     do not revive shadcn/Tailwind kit codegen as SoT


  Stack (target — document deviations in design):
  - Go application logic compiled with GoScript (s4wave/goscript); official Wasm contingency only
  - JavaScript host: React 18 thin host + forma-owned builtins; static ComponentRegistry
    (builtins + registry.custom.ts) + recursive tree renderer
  - Styling: 0build CDN CSS + runtime utilities; semantic .z-* first
  - Bridge: Go builds a component tree (Node / Component.Render); thin syscall/js seam
    converts to a host object graph + js.Func callbacks without mandating full-tree JSON
  - Widgets: hand-written Go in ui/ + thin host class maps; no shadcn/Mantine codegen or
    forma-shipped per-widget YAML as SoT

  DSL conventions (from examples/todo — evolve via OpenSpec, do not silently diverge):
  - Dot-import ui and fn in app code for fluency (nolint revive/staticcheck where needed)
  - UIMount(rootElementID, rootComponent); event handlers take ui.Context and call
    ctx.RefreshUI() / ctx.Update after state mutation
  - Package fn: Map, Filter, … — forma uses it internally; authors reuse for lists/state
  - Components are Go structs with value-receiver .With(...) for children and .Or(...)
    for fallbacks when primary children are empty; implement ui.Component with
    Render(ctx context.Context) *Node
  - ui.Context embeds context.Context for extensibility (cancellation today; values later)
  - Text leaf copy via Text{Text: "…"}; With/Or accept Component only; layout helpers
    (Row, Column, Container, …) are first-class, not raw div soup
  - ui.If for lazy conditional branches; fn holds Map, Filter, FilterMap (generic only)
  - Typed props on owned widgets (Variant, Size, …); escape hatches: Class, Style, Attrs
  - App state: plain Go structs/vars owned by the app; no React state for business logic
  - List keys and text-input behavior are spec-level concerns (see DESIGN.md)


  Composition & interop:
  - Go-side: functions returning Component or composite structs
  - JS-side: register wrappers for third-party React modules in registry.custom.ts;
    Go passes props + callbacks only; JS sanitizes events before calling Go

  Out of scope until later (see ROADMAP): SSR/SSG, Wasm-first bridge, Electron, full
  widget catalog before todo example, desktop native webview packaging before web loop
  works, kit codegen revival.

rules:
  proposal:
    - Keep Why short; put architecture and DSL detail in design, not proposal
    - State out-of-scope explicitly; defer to doc/ROADMAP.md phases when scoping
    - Name capabilities for user-visible behavior (e.g. ui-dsl, ui-runtime, ui-widgets,
      ui-docs) not internal package names alone
    - Do not prescribe shadcn/Tailwind kit codegen or per-widget YAML as SoT for new work
    - Author-visible UX changes (CLI, forma.yaml, install/sync, documented DSL usage) must
      update doc/user/ in the same change unless the proposal documents an explicit opt-out
  specs:
    - Behavior contracts (SHALL/MUST + scenarios); no import paths or framework choices
    - DSL semantics (UIMount, RefreshUI, With/Or, fn, ui.Context, events, keys,
      controlled inputs) belong
      in specs when they affect authors
    - Distinguish author-facing DSL from host/runtime behavior when they differ
  design:
    - Follow doc/DESIGN.md and doc/ROADMAP.md unless documenting a deliberate deviation
    - Record React thin host + 0build + hand-written Go widgets rationale when relevant
    - Prefer sentinel errors in Go; keep React host thin (registry + render loop + event
      sanitization)
  tasks:
    - "Order by ROADMAP — prefer owned-widgets / tip path over historical kit codegen"
    - "Link tasks to roadmap phase in PR text when useful"
    - "When a task changes author-visible behavior, include doc/user/ updates in the same task list"

operations:
  apply:
    guidance:
      - "Follow tasks.md; consult doc/ROADMAP.md for phase and doc/DESIGN.md for architecture"
      - "Preserve examples/todo as the canonical interactive demo; keep root main.go Hello-style"
      - "Hand-written ui/ widgets + host builtins: keep APIs reviewable; map variants to .z-*"
      - "React host stays dumb: no business logic in JS; sanitize third-party events before Go"
      - "After reusable implementation feedback, follow .cursor/rules/promote-reusable-feedback.mdc
        (ask durable-rule then occurrence-sweep; honor explicit promote/fix-all phrasing)"
  archive:
    guidance:
      - Note which ROADMAP phase advanced and update doc/ROADMAP.md status table if needed
      - Summarize DSL or doc deltas authors should know about
